<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Museum and Gallery work 1997-1999 — Craig Wheatley</title>
    <link rel="stylesheet" href="/css/styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/">Craig Wheatley</a>
        <nav class="main-nav">
          <a href="/">Home</a>
          <a href="/gallery/">Gallery</a>
          <a href="/#contact">Contact</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <a href="/gallery/" style="display:inline-block;margin-bottom:1rem;">← Back to gallery</a>
      <h1>Museum and Gallery work 1997-1999</h1>

      <section class="artwork-overview" style="margin-top:1rem">
        <div class="artwork-grid">

          <figure class="thumb">
            <a href="/gallery/Gallery1.jpeg" target="_blank" rel="noopener" aria-label="Open image 1 full size">
              <img src="/gallery/Gallery1.jpeg" alt="Artwork placeholder 1">
            </a>
            <figcaption>Artwork placeholder 1</figcaption>
          </figure>

          <figure class="thumb">
            <a href="/gallery/Gallery2.jpeg" target="_blank" rel="noopener" aria-label="Open image 2 full size">
              <img src="/gallery/Gallery2.jpeg" alt="Artwork placeholder 2">
            </a>
            <figcaption>Artwork placeholder 2</figcaption>
          </figure>

          <figure class="thumb">
            <a href="/gallery/Gallery3.jpeg" target="_blank" rel="noopener" aria-label="Open image 3 full size">
              <img src="/gallery/Gallery3.jpeg" alt="Artwork placeholder 3">
            </a>
            <figcaption>Artwork placeholder 3</figcaption>
          </figure>

          <figure class="thumb">
            <a href="/gallery/Gallery4.jpeg" target="_blank" rel="noopener" aria-label="Open image 4 full size">
              <img src="/gallery/Gallery4.jpeg" alt="Artwork placeholder 4">
            </a>
            <figcaption>Artwork placeholder 4</figcaption>
          </figure>
        </div>

        <div class="artwork-text" style="margin-top:1.25rem;padding:1rem;border:1px dashed #ddd;border-radius:4px;color:#333;background:#fafafa">
          <strong>Text placeholder:</strong>
          <p style="margin-top:0.5rem;color:#444">Add description, provenance, exhibition notes or other text about this body of work here.</p>
        </div>
      </section>

      <p style="margin-top:1.5rem;color:#555">Click an image to open the full version in a new tab.</p>
    </main>

    <footer class="site-footer">
      <div class="container">
        <small>&copy; <span id="year"></span> Craig Wheatley</small>
      </div>
    </footer>

    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  </body>
</html>
