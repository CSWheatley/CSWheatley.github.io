<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Gallery — Craig Wheatley</title>
    <link rel="stylesheet" href="/css/styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/">Craig Wheatley</a>
        <nav class="main-nav">
          <a href="/">Home</a>
          <a href="/gallery/">Gallery</a>
          <a href="/#contact">Contact</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <h1>Gallery</h1>

      <div class="grid" style="margin-top:1rem">
        <figure class="thumb">
          <a href="/gallery/installation/" aria-label="Open Museum and Gallery work 1997-1999 page" aria-describedby="cap-museum">
            <img src="/gallery/Gallery%20Installation.jpeg" alt="Museum and Gallery work 1997-1999">
          </a>
          <figcaption id="cap-museum">Museum and Gallery work 1997-1999</figcaption>
        </figure>

        <figure class="thumb">
          <a href="/gallery/rca-ma/index.html" aria-label="Open Royal College of Art 2001 page" aria-describedby="cap-2">
            <img src="/RCA%20MA/installation.jpg" alt="Royal College of Art 2001" style="pointer-events:none;">
          </a>
          <figcaption id="cap-2">Royal College of Art 2001</figcaption>
        </figure>

        <figure class="thumb">
          <a href="/assets/thumb3.svg" target="_blank" rel="noopener" aria-label="Open Artwork 3 in a new tab" aria-describedby="cap-3">
            <img src="/assets/thumb3.svg" alt="Artwork 3">
          </a>
          <figcaption id="cap-3">Artwork 3</figcaption>
        </figure>
      </div>

      <p style="margin-top:1.5rem;color:#555">Click an image to open the full version in a new tab. Replace these placeholders with your photos or exports.</p>
    </main>

    <footer class="site-footer">
      <div class="container">
        <small>&copy; <span id="year"></span> Craig Wheatley</small>
      </div>
    </footer>

    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  </body>
</html>
